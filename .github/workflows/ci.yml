name: CI - Lint and Integration, Unitary tests

on:
    push:
        branches: ["main", "develop", "feature/docker-ci"]
    pull_request: 
        branches: ["main", "develop", "feature/docker-ci"]

jobs:
    lint: 
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint
