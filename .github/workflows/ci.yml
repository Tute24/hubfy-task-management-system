name: CI - Lint and Integration, Unitary tests

on:
    push:
        branches: ["main", "develop", "feature/unit-tests"]
    pull_request: 
        branches: ["main", "develop", "feature/unit-tests"]

jobs:
    lint: 
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

    unit-tests: 
        name: React Components Unit Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:unit

    integration-tests: 
        name: API Integration Tests
        runs-on: ubuntu-latest

        services:
            mysql: 
                image: mysql
                env:
                 MYSQL_ROOT_PASSWORD: password
                 MYSQL_DATABASE: test_db
                ports:
                    - 3306:3306
        env:
            DATABASE_URL: mysql://root:password@localhost:3306/test_db
            SECRET_KEY: key
            #as variáveis de env supracitadas são apenas variáveis de teste para esse arquivo, e não contêm segredos da aplicação
            #essas variáveis, caso os testes de integração sejam rodados localmente, podem ser as mesmas do arquivo .env.test
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: Prisma migrations
              run: npx prisma migrate deploy

            - name: Run Integration Tests
              run: npm run test:integration
